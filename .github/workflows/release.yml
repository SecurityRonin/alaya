name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: alaya-mcp-linux-x64
            binary: alaya-mcp
            npm-pkg: cli-linux-x64
          - target: aarch64-apple-darwin
            runner: macos-latest
            artifact: alaya-mcp-darwin-arm64
            binary: alaya-mcp
            npm-pkg: cli-darwin-arm64
          - target: x86_64-apple-darwin
            runner: macos-latest
            artifact: alaya-mcp-darwin-x64
            binary: alaya-mcp
            npm-pkg: cli-darwin-x64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            artifact: alaya-mcp-win32-x64
            binary: alaya-mcp.exe
            npm-pkg: cli-win32-x64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build -p alaya --release --features "mcp llm" --target ${{ matrix.target }}

      - name: Prepare npm package (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} npm/${{ matrix.npm-pkg }}/
          mkdir -p staging
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} staging/
          cd staging && tar czf ../${{ matrix.artifact }}.tar.gz *

      - name: Prepare npm package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "npm/${{ matrix.npm-pkg }}/"
          New-Item -ItemType Directory -Force -Path staging
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" staging/
          Compress-Archive -Path staging/* -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
          if-no-files-found: ignore

      - name: Upload npm package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-${{ matrix.npm-pkg }}
          path: npm/${{ matrix.npm-pkg }}/

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: alaya-mcp-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          generate_release_notes: true
          files: |
            alaya-mcp-*.tar.gz
            alaya-mcp-*.zip

  npm-publish:
    name: Publish npm
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Download all npm packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: npm-*
          path: npm-artifacts

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish platform packages
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          for platform in cli-linux-x64 cli-darwin-arm64 cli-darwin-x64 cli-win32-x64; do
            echo "Publishing @alaya-mcp/${platform}@${VERSION}"
            # Copy binary into the package directory
            cp npm-artifacts/npm-${platform}/* npm/${platform}/
            cd npm/${platform}
            npm version "${VERSION}" --no-git-tag-version --allow-same-version
            npm publish --access public --provenance || echo "⚠ ${platform}@${VERSION} already published, skipping"
            cd ../..
          done

      - name: Publish wrapper package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd npm/alaya-mcp
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${VERSION}';
            for (const dep of Object.keys(pkg.optionalDependencies || {})) {
              pkg.optionalDependencies[dep] = '${VERSION}';
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          npm publish --access public --provenance || echo "⚠ alaya-mcp@${VERSION} already published, skipping"

      - name: Publish to MCP Registry
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          curl -L -o /tmp/mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz
          tar xzf /tmp/mcp-publisher.tar.gz -C /tmp
          cd npm/alaya-mcp
          node -e "
            const fs = require('fs');
            const sj = JSON.parse(fs.readFileSync('server.json', 'utf8'));
            sj.version = '${VERSION}';
            if (sj.packages) sj.packages.forEach(p => p.version = '${VERSION}');
            fs.writeFileSync('server.json', JSON.stringify(sj, null, 2) + '\n');
          "
          /tmp/mcp-publisher login github-oidc
          /tmp/mcp-publisher publish

  crates-publish:
    name: Publish crates.io
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master
        with:
          toolchain: stable

      - name: Publish to crates.io
        run: cargo publish -p alaya --allow-dirty || echo "⚠ crate already published, skipping"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  python-build:
    name: Build Python wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install openssl:x64-windows-static-md
          echo "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md" >> $env:GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $env:GITHUB_ENV
          echo "RUSTFLAGS=-Clink-arg=advapi32.lib -Clink-arg=crypt32.lib -Clink-arg=user32.lib -Clink-arg=gdi32.lib" >> $env:GITHUB_ENV
        shell: pwsh

      - uses: PyO3/maturin-action@6fef5d39aef859fecc0e2751d71ea0bb42a6fc78 # v1.50.0
        with:
          working-directory: alaya-py
          args: --release --out dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-${{ matrix.os }}
          path: alaya-py/dist/

  python-publish:
    name: Publish PyPI
    needs: python-build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          packages-dir: dist/
