[package]
name = "alaya"
version = "0.4.3"
edition = "2021"
rust-version = "1.85"
authors = ["Albert Hui <albert@securityronin.com>"]
description = "A memory engine for conversational AI agents, inspired by neuroscience and Buddhist psychology"
license = "MIT"
repository = "https://github.com/SecurityRonin/alaya"
documentation = "https://docs.rs/alaya"
readme = "../README.md"
keywords = ["memory", "knowledge-graph", "mcp-server", "ai-agent", "sqlite"]
categories = ["database", "science"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin)', 'cfg(tarpaulin_include)'] }


[features]
default = ["bundled-sqlite"]
bundled-sqlite = ["rusqlite/bundled"]
sqlcipher = ["rusqlite/bundled-sqlcipher"]
mcp = ["dep:rmcp", "dep:tokio", "dep:schemars", "dep:anyhow"]
llm = ["dep:ureq"]
tracing = ["dep:tracing", "dep:tracing-subscriber"]
async = ["dep:tokio"]
vec-sqlite = ["dep:sqlite-vec"]
local-embeddings = ["dep:fastembed"]

[dependencies]
rusqlite = { version = "0.32", features = ["modern_sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# MCP server (optional, for alaya-mcp binary)
rmcp = { version = "0.1", features = ["server", "macros", "transport-io"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
schemars = { version = "0.8", optional = true }
anyhow = { version = "1", optional = true }

# LLM extraction (optional, for LlmExtractionProvider)
ureq = { version = "2", features = ["json"], optional = true }

# Tracing instrumentation (optional, zero-cost when disabled)
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["fmt"], optional = true }

# KNN vector search via sqlite-vec (optional)
sqlite-vec = { version = "0.1", optional = true }

# Local ONNX-based text embeddings (optional)
fastembed = { version = "5", optional = true }

[dev-dependencies]
tempfile = "3"
proptest = "1"
tokio = { version = "1", features = ["rt", "macros"] }
criterion = { version = "0.5", features = ["html_reports"] }

[[bin]]
name = "alaya-mcp"
path = "src/bin/alaya-mcp.rs"
required-features = ["mcp"]

[[bench]]
name = "memory_bench"
harness = false
